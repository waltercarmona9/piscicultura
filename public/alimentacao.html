<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Alimentação</title>
</head>
<body>

    <h1>Registrar Alimentação Diária</h1>

    <!-- Formulário corrigido com os sinais de igual (=) -->
    <form action="/registrar-racao" method="POST">
        <label for="tanque">Qual Tanque:</label>
        <input type="text" id="tanque" name="tanque" placeholder="Ex: Tanque 1" required>
        <br><br>

        <label for="quantidade">Quantidade de Ração (Kg):</label>
        <input type="number" id="quantidade" name="quantidade" placeholder="Ex: 5" step="0.1" required>
        <br><br>

        <button type="submit">Salvar Ração</button> 
    </form>

</body>
</html>
